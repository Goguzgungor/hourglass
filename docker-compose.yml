services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: hourglass_v3
    depends_on:
      - mongodb

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: hourglass_v3
      INDEXER_POLL_MS: "5000"
      INDEXER_RECONCILE_MS: "600000"
      INDEXER_MAX_PAGES: "20"
    depends_on:
      - mongodb
    # tsx directly, not `npm run indexer`: npm would sit between the container's
    # PID 1 and the indexer, so SIGTERM on `docker compose stop` never reaches
    # the loop's shutdown handler and the container is killed after the grace
    # period instead of finishing its tick.
    command: ["npx", "tsx", "scripts/indexer.ts"]

volumes:
  mongodb_data:
