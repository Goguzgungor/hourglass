name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Lockup's `contractimport!` reads the comptroller wasm from
      # target/wasm32v1-none/release at compile time, so it must exist before
      # anything compiles the lockup crate (clippy, test).
      - name: build comptroller wasm (needed by lockup's contractimport)
        run: cargo build --target wasm32v1-none --release -p hourglass-comptroller
      - name: fmt
        run: cargo fmt --all -- --check
      # TODO: re-enable `-D warnings` once the comptroller oracle path is wired
      # (Phase 1) and Events::publish is migrated to the #[contractevent] macro.
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: wasm build (lockup)
        run: cargo build --target wasm32v1-none --release -p hourglass-lockup
